<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="home-item">
                        <a class="nav-link active" aria-current="page" href="main.html">Expense Tracker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active edit-init-budget" aria-current="page" href="#" onclick="showBudgetInput()">Edit Initial Budget</a>
                    </li>
                    <li class="nav-item budget">
                        <a class="nav-link active" href="expense.html">Track Expense</a>
                    </li>
                    <li class="nav-item budget-nav"></li>
                    <li class="menu-container">
                        <button class="burger-toggler" type="button" aria-label="Toggle menu">
                            <span class="line"></span>
                            <span class="line"></span>
                            <span class="line"></span>
                        </button>
                        <div class="burger-menu-container">
                            <a class="menu-item" href="#" onclick="showBudgetInput()">Edit Initial Budget</a>
                            <a class="menu-item" href="expense.html">Track Expense</a>
                            <span class="menu-item budget-value">0 MMK</span>
                        </div>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
        <div class="form-budget-container hide">
            <div class="form-budget">
                <button type="button" class="btn-close" onclick="hideBudgetInput()" aria-label="Close"></button>
                <h5 style='margin-left:20px'>Initial Budget</h5>
                <label class="ib-label spacing">Amount in MMK</label><br>
                <input type="number" class="ib-input spacing" placeholder="Enter number only..."> <br>
                <button type="button" class="budget-btn spacing btn btn-success">Okay</button>
            </div>
        </div>
        <h5 class="title">Fill both inputs to calcute your expenses.</h5>
        <div class="input-group mb-3">
            <span class="input-group-text">Amount</span>
            <span class="input-group-text">MMK</span>
            <input type="number" class="form-control amount" id="amount-input" aria-label="Dollar amount (with dot and two decimal places)">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">Description</span>
            <span class="input-group-text">Type</span>
            <input type="text" class="form-control describe" id="type-input" aria-label="Bought Product (text only)">
        </div>
        <button type="button" class="btn btn-success sumit-btn">Sumit</button>
        <button type="button" class="btn btn-danger reset-bd">Reset Budget</button>
        <div class="alert-container"></div>
    <script src="../script/main.js"></script>
    <script src="../script/expense.js"></script>
</body>
</html>
