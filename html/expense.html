<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Expenses</title>
    <link rel="stylesheet" href="../css/expense.css">
    <link rel="icon" href="../brand_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script/supabase-config.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a href="main.html" class="home">← Back to home</a>
        </div>
        <canvas class="expense-chart" id="expense-chart"></canvas>
        <div class="btn-group dropdown">
            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Unordered
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item decend" href="#">Decending Order</a></li>
                <li><a class="dropdown-item ascend" href="#">Acending Order</a></li>
            </ul>
        </div>
        <ol class="list-group list-group-numbered"></ol>
        <button type="button" class="btn btn-danger btn-delete">Delete All Expenses</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
    <script src="../script/expense.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
